<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta Pixel Code -->
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1528173681585526');
        fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=1528173681585526&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->

    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="ScorX">
    <meta name="theme-color" content="#0F2A44">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{ page.title }} | ScorX">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:image" content="{{ site.url }}{{ page.og_image | default: '/images/phone_screen_game_card.jpg' }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title }} | ScorX">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ site.url }}{{ page.og_image | default: '/images/phone_screen_game_card.jpg' }}">

    <!-- Apple -->
    <meta name="apple-itunes-app" content="app-id=6753859833">

    <title>{{ page.seo_title | default: page.title }} | ScorX</title>
    <link rel="stylesheet" href="/css/style.css">

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon32.png">
    <link rel="shortcut icon" href="/images/favicon32.png">
    <link rel="apple-touch-icon" href="/images/favicon192.png">

    {% if page.canonical %}<link rel="canonical" href="{{ page.canonical }}">{% else %}<link rel="canonical" href="{{ site.url }}{{ page.url }}">{% endif %}

    <!-- RSS Feed -->
    <link rel="alternate" type="application/rss+xml" title="ScorX Blog" href="/blog/feed.xml">
</head>
<body>
    {% include site-header.html %}

    {{ content }}

    {% include site-footer.html %}
</body>
</html>
