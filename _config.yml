future: true

title: ScorX
description: Youth Sports Performance Tracking App — Live Game Scoring & Player Statistics
url: "https://www.scorx.com.au"
baseurl: ""

# Single source for the public contact address (footer, etc). Switch to the @scorx.com.au mailbox here once it exists.
contact_email: scorxapp@gmail.com

permalink: /blog/:slug/

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: blog/feed.xml

exclude:
  - documentation/
  - CLAUDE.md
  - "images/scor_x.zip"
  - Gemfile
  - Gemfile.lock
  - supabase/
  - card/render-test.html
